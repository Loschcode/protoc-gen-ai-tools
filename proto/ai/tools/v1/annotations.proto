syntax = "proto3";

package ai.tools.v1;

option go_package = "github.com/Loschcode/protoc-gen-ai-tools/ai/tools/v1;ai_tools_v1";

import "google/protobuf/descriptor.proto";

// ToolDefinition describes an AI agent tool backed by an RPC method.
// The protoc-gen-ai-tools plugin uses this to generate Go AgentTool
// definitions with JSON Schema parameters derived from the request message.
message ToolDefinition {
  // Tool name used by the AI agent (e.g. "page_themes_update").
  string name = 1;

  // Human-readable description shown to the LLM.
  string description = 2;

  // Whether to enforce strict parameter validation (additionalProperties: false).
  bool strict = 3;

  // When true, generate an executor function that calls the gRPC service
  // directly (unmarshal args → call RPC → marshal response). Tools without
  // this flag only get the tool definition generated.
  bool auto_execute = 4;
}

extend google.protobuf.MethodOptions {
  ToolDefinition rpc_tool = 52104;
}

// ToolFieldOptions controls how a field behaves in the AI tool schema.
message ToolFieldOptions {
  // When true, this field is excluded from the AI tool schema entirely.
  // Use for developer-facing fields (e.g. metadata maps with dynamic keys)
  // that are incompatible with strict mode or not useful for end users.
  bool skip = 1;

  // When set, this field is an ID that should be aliased for the LLM.
  // The executor replaces raw UUIDs with human-readable aliases
  // (e.g. "link-1", "step-3") in responses, and resolves aliases back
  // to UUIDs in requests. The prefix is used for alias generation
  // (e.g. prefix "link" produces "link-1", "link-2", etc.).
  // Fields with the same prefix share the same alias counter, so
  // link_id on CreateWorkflowStepRequest resolves against the same
  // map as id on CreateLinkResponse.
  string alias_prefix = 2;
}

extend google.protobuf.FieldOptions {
  ToolFieldOptions tool_field = 52105;
}
